name: IndexNow

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  indexnow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Give GitHub Pages time to publish the new build before pinging.
      - name: Wait for Pages deploy
        run: sleep 120

      - name: Submit changed URLs
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            python3 scripts/indexnow.py --before "${{ github.event.before }}" --after "${{ github.sha }}"
          else
            python3 scripts/indexnow.py   # manual run: submit all pages
          fi
