{%- assign g = site.giscus -%}
{%- assign gb_lang = page.lang | default: 'en' -%}
{%- assign gb = site.data.ui[gb_lang] -%}
{%- if g.repo_id != blank and g.category_id != blank -%}
<section class="guestbook" data-guestbook data-repo="{{ g.repo }}" data-repo-id="{{ g.repo_id }}" data-category="{{ g.category }}" data-category-id="{{ g.category_id }}" data-term="{{ g.term | default: 'cult-guestbook' }}" data-lang="{{ gb_lang }}">
  <span class="eyebrow">{{ gb.guest_eyebrow }}</span>
  <h2>{{ gb.guest_title }}</h2>
  <p>{{ gb.guest_note }}</p>
  <div class="guestbook-slot"></div>
</section>
{%- endif -%}
