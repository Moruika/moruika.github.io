<!DOCTYPE html>
<html lang="{{ page.lang | default: 'en' }}">
<head>
  <meta name="msvalidate.01" content="E49CE94A63CEB263DAFC5AD3B0902CDB" />
  <meta name="google-site-verification" content="YscCNaqzRwdV8Bz940R85SD_68N8s-3zpKXJeWhJFGA" />
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% if page.title %}{{ page.title }} — {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">

  <meta property="og:site_name" content="Morui">
  <meta property="og:title" content="{% if page.title %}{{ page.title }} — {% endif %}{{ site.title }}">
  <meta property="og:description" content="{{ page.description | default: site.description }}">
  <meta property="og:type" content="website">
  <meta property="og:url" content="{{ site.url }}{{ page.url }}">

  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebSite",
    "name": "Morui",
    "alternateName": "Moruika",
    "url": "{{ site.url }}/"
  }
  </script>

  <link rel="icon" type="image/png" href="{{ '/favicon.png' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  <script src="{{ '/assets/js/site.js' | relative_url }}" defer></script>
</head>
<body>
  {% assign lang = page.lang | default: "en" %}
  {% assign ui = site.data.ui[lang] %}
  {% assign base = "" %}
  {% if lang == "ru" %}{% assign base = "/ru" %}{% endif %}
  {% include nav.html %}
  <main class="wrap">
    {{ content }}
  </main>
  <footer class="site-footer wrap">
    <span>Morui © {{ 'now' | date: '%Y' }}</span>
    <span>
      <a href="{{ base | append: '/#links' | relative_url }}">{{ ui.footer_links }}</a>
    </span>
  </footer>
</body>
</html>
