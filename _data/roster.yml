  history_en: 'Cheburaska is one of Cult Of Maids’ newest members, so his team history is still taking shape. He
    plays positions 4 and 5, where he has to spot danger early, choose the right target for control and save a teammate
    at the exact moment that player has mentally written their farewell message. It is a demanding job for someone
    with limited experience, but one good support decision can completely change a match.


    The team calls his special resource **“femboy power.”** It is not an official item in any Dota 2 guide; it is
    the all-purpose explanation for a clutch save, a teammate surviving one more fight than expected, or a game
    that everyone had already declared lost somehow staying alive. On paper, this is positioning and timing. In
    team chat, the explanation is usually shorter.


    Cheburaska has fewer stories than the roster veterans, but that also leaves room to grow and develop a style
    of his own. Support play is not always measured in kills: sometimes the most important contribution is using
    an ability on time, placing vision, or simply not being the first hero the enemy sees.


    The team has already noticed his potential and occasionally compares his early results to supports from much
    higher tiers. It is too soon for final verdicts, but that is a good thing: a biography does not have to be complete
    on publication day. The funniest chapters usually arrive later.'
  history_ru: 'Cheburaska — один из самых новых участников Cult Of Maids, поэтому его история в команде ещё только
    набирает объём. Он играет на позициях 4 и 5, где часто приходится замечать опасность раньше остальных, выбирать
    правильную цель для контроля и спасать союзника в тот момент, когда тот уже мысленно написал прощальное сообщение.
    Для игрока с небольшим стажем это непростая задача, но именно в поддержке даже одно удачное решение может полностью
    изменить ход матча.


    В команде его особый ресурс называют **«фембойной силой»**. Это не пункт из официальной методички по Dota 2,
    а универсальное объяснение тому, почему в критический момент появляется сейв, почему союзник неожиданно переживает
    ещё одну драку и почему игра, которую уже считали проигранной, продолжает жить. На бумаге это называется позиционированием
    и таймингами. В командном чате формулировка обычно короче.


    Пока у Cheburaska меньше историй, чем у ветеранов ростера, зато есть пространство для развития и возможность
    выстроить собственный стиль. Поддержка — роль, в которой результат не всегда виден по количеству убийств: иногда
    важнее вовремя дать способность, поставить обзор или просто не оказаться первым героем, которого увидел противник.


    Команда уже успела заметить в нём потенциал и временами сравнивает его ранние успехи с игрой саппортов куда
    более высокого уровня. До окончательных выводов ещё далеко, но это и хорошо: биография не обязана быть законченной
    в день публикации. Самые смешные эпизоды, как правило, появляются позже.'
