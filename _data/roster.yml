  history_en: |-
    Arrived not long ago, and results came before the team could weave a legend. Positions 1 and 5: a carry who turns farm into pressure, or a support who sees where help will be needed before anyone asks. Sharp micro, and a sense of what a fight will demand seconds from now.

    In the roster he bears the title **"best Lich in the world"**. The footnotes, rivals and method of counting remain unpublished, yet it is spoken so confidently that some committee must have judged it and forgotten to summon the other Lich players.
  history_ru: |-
    Пришёл недавно, и результаты появились раньше, чем команда успела сплести легенду. Позиции 1 и 5: керри, превращающий фарм в давление, или саппорт, видящий нужду в помощи раньше просьбы. Острое микро и чутьё на то, чего драка потребует через секунды.

    В составе он носит титул **«лучший Lich в мире»**. Сноски, соперники и способ подсчёта не опубликованы, но звание звучит так уверенно, будто некая комиссия всё решила и забыла позвать остальных Lich-игроков.
