    He has walked beside the team through every form it took, from idle games to serious Dota 2. Positions 2 and 6, a pairing that confuses outsiders and is accepted within as the local order. On Meepo he was named **"Kazakhstan's best dwarf"**; the criteria were never published. Invoker answers to him too.

    The **Khanty-Mansiysk International** lives in the chronicle: the details change with every teller, but the name outlasts every patch. He sometimes chooses a move whose purpose is revealed minutes later, if at all. Questions wait until the match is over.
  history_ru: |-
    Он прошёл рядом с командой через все её обличья, от случайных игр до серьёзной Dota 2. Позиции 2 и 6: сочетание, которое сбивает с толку чужих и принято своими как местный порядок. На Meepo его нарекли **«лучшим карликом Казахстана»**; критерии никто не публиковал. Invoker тоже ему подчиняется.

    **Ханты-Мансийский International** живёт в летописи: подробности меняются с каждым рассказчиком, а название переживает любые патчи. Иногда он выбирает ход, смысл которого открывается через несколько минут — если открывается. Вопросы ждут конца матча.
