  history_en: Arrived when the group began to resemble a machine with a purpose. “God Sven” is the name used when
    explanations are unnecessary; “second Miracle-” when they are. His routes through the jungle are studied like
    traces left at a crime scene. He knows when to disappear into the farm and when to return. The carry role has
    few secrets for him — or so the story goes.
  history_ru: Появился, когда группа начала напоминать механизм с определённой целью. «Бог Свен» — так говорят,
    когда объяснения не нужны; «второй Miracle-» — когда нужны. Его маршруты по лесу изучают как следы на месте
    преступления. Он знает, когда исчезнуть в фарме, а когда вернуться. У керри осталось мало секретов — по крайней
    мере, так рассказывают.
