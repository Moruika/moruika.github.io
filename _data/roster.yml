  history_en: |-
    Founder of Cult Of Maids and its coach, whose work begins where statistics end: not only what a player did, but why, what they feared, and when they stopped trusting their own play. Roles are chosen by the person behind the keyboard as much as by numbers.

    The Turbo tournament victory bears his mark, though a coach rarely stands at the centre of a highlight. Most of the work happens between matches, in conversations no audience hears: naming a mistake, changing the plan, convincing a player they can do more than they believe. It is not magic, though from outside it is hard to tell.
  history_ru: |-
    Основатель Cult Of Maids и её тренер, чья работа начинается там, где кончается статистика: не только что сделал игрок, но почему, чего боялся и когда перестал доверять своей игре. Роли выбираются по человеку за клавиатурой не меньше, чем по цифрам.

    Победа на Turbo-турнире несёт его след, хотя тренер редко оказывается в центре хайлайта. Основная работа идёт между матчами, в разговорах, которых никто не слышит: назвать ошибку, сменить план, убедить игрока, что он способен на большее. Это не магия, хотя со стороны не отличить.
