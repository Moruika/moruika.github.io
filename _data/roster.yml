  history_en: 'Keeper of one of Cult Of Maids’ most enduring pieces of internal lore: the water carrier, the Huskar who did
    not survive and never received the Aegis-cross. Some stories are remembered for a tournament result; others become immortal
    because everyone remembers exactly how badly things went. Prokopchelik has secured his place in the team’s mythology.'
  history_ru: 'Хранитель одной из самых живучих легенд Cult Of Maids: водонос, Хускар, который не выжил и не получил крест.
    Одни истории запоминаются благодаря турнирным результатам, другие — потому что все прекрасно помнят, насколько всё пошло
    не по плану. Прокопчелик уже занял своё место во внутренней мифологии команды.'
