  history_en: 'Joined the team as Cult Of Maids began moving towards a more structured competitive approach. Known in team
    lore as “God Sven” and “the second Miracle-”, Mamut Rahal takes the carry role seriously: farming patterns, timing, resource
    efficiency and knowing when to join a fight. His approach to farming has become a reference point in the team’s discussions
    about playing position one.'
  history_ru: 'Присоединился к команде на этапе, когда Cult Of Maids начала двигаться к более организованному соревновательному
    подходу. Внутри команды известен как «Бог Свен» и «второй Miracle-». Мамут Рахал серьёзно относится к тонкостям позиции
    керри: маршрутам фарма, таймингам, эффективности ресурсов и выбору момента для подключения к драке. Его паттерны фарма
    стали ориентиром для обсуждения игры на первой позиции.'
