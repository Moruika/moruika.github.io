  history_en: 'One of the first members of Cult Of Maids, Pavuk remembers when the team was simply a group of people
    looking for games rather than a roster with tournament ambitions. He has mostly occupied positions 3 and 4,
    but predictability has never been his defining trait. He favours pressure, sudden decisions and builds that
    sometimes look as if they were invented after the matchmaking button had already been pressed.


    His familiar heroes include Nyx Assassin, Abaddon, Enigma, Venomancer and Pit Lord. The Abaddon chapter is especially
    important: Pavuk claims to have introduced the meta first for carry Abaddon and later for support Abaddon. While
    other players debate standard builds, he offers a new interpretation of the hero and waits for everyone else
    to catch up. His claim of a 100% Venomancer win rate remains one of those statistical miracles nobody seems
    eager to test over a meaningful sample size.


    Away from the draft, Pavuk has another ability that does not fit neatly into a stat sheet. His **legendary feeder
    aura** affects more than the match itself: according to local reports, the internet may disappear for Pavuk
    and his neighbours at the same time. At that point, the team’s strategy becomes beautifully simple—wait for
    reality to reconnect.


    Still, his role is not limited to memes. Pavuk is a long-standing member who knows the team’s history and habits;
    his aggressive style and unusual picks can put opponents in uncomfortable positions. Sometimes it is a brilliant
    plan, sometimes it becomes material for the next team discussion. The verdict usually arrives after the match.'
  history_ru: 'Один из первых участников Cult Of Maids, Pavuk помнит команду ещё с тех времён, когда она была скорее
    компанией, собравшейся поиграть, чем коллективом с турнирными планами. Со временем он закрепился на позициях
    3 и 4, но его стиль никогда не отличался чрезмерной любовью к предсказуемости. Он предпочитает давление, резкие
    решения и сборки, которые иногда выглядят так, будто были придуманы уже после нажатия кнопки поиска матча.


    В его пуле есть Nyx Assassin, Abaddon, Enigma, Venomancer и Pit Lord. Отдельная глава истории связана с Abaddon:
    Pavuk приписывает себе знакомство меты сначала с керри-Abaddon, а затем и с саппорт-Abaddon. Пока одни игроки
    спорят о стандартных сборках, он предлагает новую трактовку героя и ждёт, когда остальные догонят идею. А заявление
    о стопроцентном винрейте на Venomancer остаётся одним из тех статистических чудес, которые никто не спешит проверять
    на большой выборке.


    За пределами драфта у Pavuk есть ещё одна способность, которую сложно отразить в таблице характеристик. Его
    **аура легендарного фидера** влияет не только на матч, но, по слухам, и на интернет вокруг него: соединение
    может пропасть у самого Pavuk и заодно у соседей. В такие минуты командная стратегия упрощается до одного пункта
    — дождаться, пока реальность снова загрузится.


    При этом его роль в команде не сводится к мемам. Pavuk — давний участник коллектива, знакомый с его историей
    и внутренними привычками; агрессивный стиль и нестандартные пики способны поставить соперника в неудобное положение.
    Иногда это гениальный план, иногда материал для следующего командного разговора. Обычно выясняется уже после
    матча.'
