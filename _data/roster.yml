  history_en: Founder. Coach. The person watching the gaps between what a player can do and what they believe they
    can do. His work is rarely visible in the scoreboard, though the Turbo tournament victory still carries traces
    of it. He reads people, finds the thread, and pulls just enough to change the shape of the whole roster.
  history_ru: Основатель. Тренер. Тот, кто смотрит на расстояние между тем, что игрок умеет, и тем, во что сам верит.
    Его работа редко видна в таблице результатов, хотя в победе на Turbo-турнире до сих пор остались её следы. Он
    читает людей, находит нить и тянет ровно настолько, чтобы изменился весь состав.
