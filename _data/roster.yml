    Callsign 200, reserve, position three. His biography begins and at once arrives at a single recorded answer: **beer**. It is no account of style or career, yet the archive finds it raises more questions than any résumé.

    Team history survives in fragments: remarks, words whose meaning was plain on one particular evening. The context fades, witnesses remember differently, and the word lives on, immune to clarification. STRATZ keeps the numbers; the team keeps what the numbers cannot hold.
  history_ru: |-
    Позывной 200, запас, третья позиция. Биография начинается и тут же упирается в единственную записанную фразу: **пиво**. Это не рассказ о стиле или карьере, но архив считает, что она порождает больше вопросов, чем любое резюме.

    Командная история уцелела обрывками: репликами, словами, чей смысл был ясен в один конкретный вечер. Контекст стирается, свидетели помнят по-разному, а слово живёт дальше, неуязвимое для уточнений. STRATZ хранит цифры; команда хранит то, что цифрам не вместить.
