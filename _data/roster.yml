  history_en: Recently arrived; the results appeared before the explanations did. Strong micro, an instinct for
    role boundaries, and a quiet understanding of what a fight will ask for next. Within the team, the title “best
    Lich in the world” is spoken without a footnote. Whether it is a joke or a warning depends on the match.
  history_ru: Присоединился недавно; результаты появились раньше объяснений. Сильное микро, чутьё на границы ролей
    и спокойное понимание того, чего потребует следующая драка. В команде звание «лучший Lich мира» произносят без
    сносок. Шутка это или предупреждение — зависит от матча.
