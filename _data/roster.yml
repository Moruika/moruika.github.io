  history_en: 'Captain and organiser of Cult Of Maids, focused on building the roster, developing the team and preparing for
    The International. Known within the team for a strong macro-oriented approach: map awareness, tempo, resource distribution
    and decisions that shape a match before the decisive fight. His hero pool includes Dawnbreaker, Windranger, Techies, Grimstroke
    and Vengeful Spirit. He has beaten players who have competed at The International, streamers and other strong opponents,
    and continues to develop both the team and his own game.'
  history_ru: 'Капитан и организатор Cult Of Maids, отвечающий за развитие состава и подготовку команды к The International.
    Известен сильной макроигрой: пониманием карты, темпа, распределения ресурсов и решений, которые определяют матч ещё до
    решающей драки. В его пуле — Dawnbreaker, Windranger, Techies, Grimstroke и Vengeful Spirit. За плечами — победы над участниками
    The International, стримерами и другими сильными соперниками. Сейчас основной фокус — подготовка состава, развитие команды
    и стриминг.'
