  history_en: The water carrier. The Huskar who did not survive. The cross that never came. Three fragments, passed
    from one match to another, with no agreed account of what really happened. Prokopchelik has no need to correct
    the record; the silence has become part of the legend.
  history_ru: 'Водонос. Хускар, который не выжил. Крест, которого не было. Три фрагмента, переходящие из матча в
    матч, — и ни одной общей версии того, что случилось на самом деле. Прокопчелик не спешит исправлять летопись:
    молчание уже стало частью легенды.'
