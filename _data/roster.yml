  history_en: A recent addition to the roster who is still keeping his full potential carefully hidden. His hero pool includes
    Void Spirit, Zeus, Rubick, Lion and the legendary Pudge. Rubick is known for a particular talent for claiming kills, Lion
    brings a special kind of “discomfort” to the enemy, and Pudge hooks remain a work in progress. Behind the jokes is a player
    whose ceiling has yet to be fully revealed.
  history_ru: Относительно новое пополнение состава, которое до сих пор тщательно скрывает свой настоящий потенциал. Играет
    на Void Spirit, Zeus, Rubick, Lion и легендарном Pudge. Rubick известен особым талантом забирать убийства, Lion приносит
    соперникам специфическое недомогание, а хуки Pudge пока остаются предметом отдельной легенды. За шутками скрывается игрок,
    чей потенциал ещё только предстоит раскрыть.
