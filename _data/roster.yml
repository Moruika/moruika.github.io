  history_en: 'Rapunzel joined Cult Of Maids relatively recently, and the first results arrived before the team
    had time to prepare a long legend for him. He plays positions 1 and 5—roles with very different responsibilities,
    both of which require understanding what a hero is supposed to do at a particular moment. A carry must turn
    farm into pressure at the right time; a support must notice where help will be needed before anyone starts asking
    for it.


    Within the roster, Rapunzel has earned the title **“best Lich in the world.”** The footnotes, list of competitors
    and scoring methodology have not yet been published. Still, the title is delivered with such confidence that
    one might assume an international committee has already reviewed the case and simply forgot to invite every
    other Lich player.


    Behind the meme is a real set of strengths: strong micro, an understanding of role boundaries and an ability
    to anticipate what a fight will demand a few seconds later. Those qualities help whether he is playing position
    one or shifting into support duties. Moving between those responsibilities is not easy, especially when the
    team expects both reliable farming and a perfectly timed save.


    His story with the team is still developing. A new player needs time to learn the squad’s habits, build coordination
    and leave his own moments in the shared chronicle. But if the best-Lich title has already been awarded, the
    only remaining question is what other honours the team will invent after the next series of matches.'
  history_ru: 'Rapunzel присоединился к Cult Of Maids сравнительно недавно, и первые результаты появились быстрее,
    чем команда успела подготовить для него длинную легенду. Он играет на позициях 1 и 5 — двух ролях с совершенно
    разными задачами, но обе требуют понимать, чего ждут от героя в конкретный момент. На керри важно вовремя превращать
    фарм в давление, а на поддержке — замечать, где команде понадобится помощь ещё до того, как кто-нибудь начнёт
    её просить.


    Внутри состава Rapunzel получил титул **«лучший Lich в мире»**. Сноски, список конкурентов и методика подсчёта
    пока не опубликованы. Впрочем, звание произносят с такой уверенностью, будто вопрос уже рассмотрела международная
    комиссия, а её заседание случайно пропустили все остальные игроки Lich.


    За этим мемом стоит вполне конкретный набор сильных сторон: хорошее микро, понимание границ своей роли и способность
    оценивать, что произойдёт в драке через несколько секунд. Это помогает и тогда, когда он играет на первой позиции,
    и когда приходится отойти на поддержку. Переключаться между такими обязанностями непросто, особенно если команда
    одновременно ждёт от тебя и фарма, и своевременного спасения.


    Его история в коллективе ещё развивается. Новичку нужно время, чтобы освоить командные привычки, выработать
    взаимодействие и оставить собственные эпизоды в общей летописи. Но если титул лучшего Lich уже выдан, остаётся
    только выяснить, какие ещё награды команда успеет придумать по итогам следующих матчей.'
