    Came when the group began to take the shape of a team. Carry, called **God Sven**, sometimes "the second Miracle-". The names are grand, but they speak of trust in his late game. His paths through the jungle are discussed as a discipline of their own, and rumour says Tier 1 carries study them to learn where gold hides. No confirmation exists, and none is needed.

    Today he is God Sven; tomorrow someone will swear he invented a new way to farm the ancient camps. In Cult Of Maids a title needs no proof while the team keeps winning.
  history_ru: |-
    Пришёл, когда компания начала принимать облик команды. Керри, которого зовут **Богом Sven**, а порой «вторым Miracle-». Имена громкие, но говорят о доверии к его поздней стадии. Его тропы по лесу обсуждают как отдельную дисциплину, а по слухам, керри первого уровня изучают их, чтобы понять, где прячется золото. Подтверждений нет, и они не нужны.

    Сегодня он God Sven; завтра кто-нибудь поклянётся, что он изобрёл новый способ фармить древних. В Cult Of Maids титулу не нужны доказательства, пока команда продолжает побеждать.
