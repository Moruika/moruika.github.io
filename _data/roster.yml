  history_en: The first to enter the roster — and one of the few who remembers what it looked like before it had
    a name worth fearing. Nyx, Abaddon, Enigma, Venomancer and Pit Lord are familiar signs of an approaching problem.
    The carry Abaddon story still circulates; so does the Venomancer record no one seems eager to test. His builds
    are difficult to explain even to those standing beside him. Pressure first. Questions later.
  history_ru: Первый, кто вошёл в состав, и один из немногих, кто помнит его до того, как у него появилось имя,
    которое стоило опасаться. Nyx, Abaddon, Enigma, Venomancer и Pit Lord — знаки приближающейся проблемы. История
    о керри-Abaddon всё ещё ходит по кругу; как и запись о Venomancer, которую никто не спешит проверять. Его сборки
    трудно объяснить даже тем, кто стоит с ним на одной стороне. Сначала давление. Вопросы потом.
