  history_en: 'Callsign: 200. The archive records one answer: beer. Everything else is sealed behind old matches,
    missing context and a few memories that grow less reliable each time they are retold. A short entry by design.
    Some names become more interesting when nothing is explained.'
  history_ru: 'Позывной: 200. Архив записал только один ответ: пиво. Всё остальное скрыто за старыми матчами, потерянным
    контекстом и воспоминаниями, которые становятся менее надёжными с каждым пересказом. Краткая запись — намеренно.
    Некоторые имена интереснее, когда ничего не объясняют.'
