  history_en: 'Slanets is one of Cult Of Maids’ long-standing players, having been around through several stages
    of the team’s evolution—from casual games together to a more serious approach to Dota 2. His listed positions
    are 2 and 6, a combination that raises questions in a conventional roster description but has long been accepted
    as part of the team’s local order. Not every player can move so freely between a familiar role and a mysterious
    number from the team’s private vocabulary.


    On Meepo, he earned the unofficial title **“Kazakhstan’s best dwarf”**—an impressive-sounding honour whose selection
    criteria have never been published. Invoker is another strong pick for him, demanding mechanics, a good memory
    for combinations and the ability to keep more options in mind than an opponent can reasonably survive in one
    fight.


    A special place in the team chronicle belongs to the **Khanty-Mansiysk International**. It is more than a trip
    or a single match: the name itself has become part of Cult Of Maids folklore. The details vary with every retelling,
    and each new storyteller seems to release another patch for the story. The title, however, has survived every
    version.


    Slanets can play patiently and methodically, then choose an option whose purpose becomes clear several minutes
    later—if it becomes clear at all. That is part of his appeal: not everything has to be explained immediately.
    Ideally, Meepo stays alive, Invoker gets the spells off, and the team saves its questions until the match is
    over.'
  history_ru: 'Slanets — один из давних игроков Cult Of Maids, который прошёл с командой несколько этапов её развития:
    от обычных совместных матчей до более серьёзного отношения к Dota 2. Его позиции — 2 и 6, сочетание, которое
    в стандартном описании ростера вызывает вопросы, зато внутри команды давно воспринимается как часть местного
    порядка вещей. Не каждый игрок способен настолько свободно перемещаться между привычной ролью и загадочной цифрой
    из внутреннего словаря.


    На Meepo он заслужил неофициальное звание **«лучший карлик Казахстана»** — титул, который звучит внушительно,
    хотя критерии отбора так и не были опубликованы. Invoker тоже входит в число его сильных героев: здесь важны
    механика, память на комбинации и способность держать в голове больше вариантов, чем соперник готов пережить
    за одну драку.


    Отдельное место в командной летописи занимает **Ханты-Мансийский International**. Это не просто поездка или
    отдельный матч, а событие, название которого со временем стало самостоятельной частью легенды Cult Of Maids.
    Подробности пересказывают по-разному, и каждый новый рассказчик, кажется, добавляет собственный патч к истории.
    Но само название пережило все версии и никуда не исчезло.


    Slanets умеет играть расчётливо, а иногда выбирает решение, смысл которого становится понятен только через несколько
    минут — если становится вообще. В этом и заключается часть его обаяния как игрока: не всё обязано объясняться
    сразу. Главное, чтобы Meepo оставался жив, Invoker успевал нажать нужные заклинания, а команда не задавала лишних
    вопросов до конца матча.'
