  history_en: 'New to the roster, though the real reason for his arrival remains classified by the squad. Void Spirit,
    Zeus, Rubick and Lion leave a familiar trail: stolen kills, strange discomfort, and fights that seem to start
    a second before anyone notices. The Pudge hooks are still missing their target. Perhaps that is the point. The
    ceiling has not been found.'
  history_ru: 'В составе недавно, хотя настоящая причина его появления до сих пор засекречена самой командой. Void
    Spirit, Zeus, Rubick и Lion оставляют знакомый след: украденные убийства, странное недомогание и драки, начинающиеся
    за секунду до того, как их замечают. Хуки Pudge всё ещё не находят цель. Возможно, в этом и заключается замысел.
    Потолок пока не найден.'
