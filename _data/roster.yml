  history_en: 'Captain and organiser of Cult Of Maids, Morui handles roster building, team development and the difficult
    task of turning a group of friends into a squad with real competitive ambitions. The team began as a casual
    group playing whatever was available during the COVID era; over time, Dota 2 became the focus, tournaments followed,
    and plans grew more serious—including preparation for The International. Outside the team, he develops his own
    project and streams, apparently unconvinced that organising a roster is enough work already.


    In-game, he values map awareness, tempo and the ability to punish mistakes. Dawnbreaker, Windranger, Techies,
    Grimstroke and Vengeful Spirit are among the heroes he uses to change the shape of a match. His stories include
    wins over TI participants, streamers and other experienced players. As with any good team folklore, the details
    tend to gain a little extra colour every time they are retold.


    Yet Morui’s most important title has little to do with captaincy or macro play. He is the **Turbo Emperor**.
    His match count has reached the point where ordinary counting feels like a waste of time: while someone else
    finishes a single game, Morui seems to have lived through an entire Turbo era. One day his statistics may need
    their own server, separate from STRATZ, with a backup kept somewhere safe.


    The actual mission is serious enough: develop Cult Of Maids, shape the roster and prepare for higher levels
    of competition. Still, even the most detailed plan can be postponed if there is one more quick match nearby.
    This is only the beginning.'
  history_ru: 'Капитан и организатор Cult Of Maids: собирает ростер, следит за тем, чтобы команда не распалась на
    отдельные соло-приключения, и пытается превратить компанию друзей в коллектив с настоящими соревновательными
    амбициями. История команды началась с обычных игр во времена COVID, но со временем Dota 2 заняла центральное
    место, появились турниры, планы на развитие и разговоры о The International. Помимо командных дел, Morui развивает
    собственный проект и стримит — потому что одной работы над составом, видимо, недостаточно.


    В игре он ценит понимание карты, темпа и чужих ошибок. Dawnbreaker, Windranger, Techies, Grimstroke и Vengeful
    Spirit — лишь часть героев, на которых он готов менять ход матча. В его истории есть победы над участниками
    TI, стримерами и другими опытными игроками; подробности таких встреч со временем обрастают новыми деталями,
    как и положено хорошему командному фольклору.


    Но главный титул Morui не связан ни с капитанской повязкой, ни с макроигрой. Это **Император турбо**. Количество
    сыгранных матчей настолько велико, что обычный подсчёт уже кажется бесполезным занятием: пока кто-то закрывает
    одну игру, Morui успевает прожить целую маленькую турбо-эпоху. Возможно, однажды его статистику придётся хранить
    отдельно от STRATZ — на собственном сервере и с резервной копией.


    Сейчас задача остаётся вполне серьёзной: развивать Cult Of Maids, работать над составом и готовиться к более
    высоким уровням игры. Впрочем, даже самый подробный план может быть отложен, если где-то рядом нашёлся ещё один
    быстрый матч. Всё только начинается.'
