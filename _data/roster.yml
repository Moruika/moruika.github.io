  history_en: 'Callsign 200. One word explains the legend: beer. A member of the Cult Of Maids story whose public profile
    is deliberately brief, leaving the rest to team lore, match memories and the context that only the squad fully understands.
    Not every legend needs a long introduction.'
  history_ru: 'Позывной 200. Одно слово объясняет легенду: пиво. Участник истории Cult Of Maids, чья публичная биография намеренно
    остаётся лаконичной, оставляя остальное внутреннему лору, воспоминаниям о матчах и контексту, который до конца понимает
    только команда. Не каждой легенде нужно длинное представление.'
