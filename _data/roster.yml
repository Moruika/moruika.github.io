  history_en: Captain of Cult Of Maids. He reads the map as if the next few minutes have already happened somewhere
    out of sight. Dawnbreaker, Windranger, Techies, Grimstroke and Vengeful Spirit are among the names that keep
    returning to his drafts. There are stories of victories over TI participants and familiar faces from the stream;
    the details are rarely told twice in the same way. The roster is still being assembled around a plan not yet
    made public.
  history_ru: Капитан Cult Of Maids. Смотрит на карту так, будто следующие несколько минут уже однажды произошли
    — где-то за пределами видимого. Dawnbreaker, Windranger, Techies, Grimstroke и Vengeful Spirit снова и снова
    появляются в его драфтах. Ходят истории о победах над участниками TI и знакомыми лицами из стримов, но подробности
    каждый раз звучат по-разному. Состав всё ещё собирается вокруг плана, о котором пока не говорят вслух.
