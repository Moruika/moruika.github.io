  history_en: 'A new name with too little history to be trusted and too much potential to be ignored. He works from
    the support positions, where a quiet save can rewrite an entire match. The squad calls his hidden reserve “femboy
    power”: delicate hands, suspiciously precise timing, and a habit of keeping games alive when they should have
    ended. The rest is still unfolding.'
  history_ru: 'Новое имя: истории пока слишком мало, чтобы доверять ему, а потенциала слишком много, чтобы не замечать.
    Он действует с позиций поддержки, где один тихий сейв способен переписать весь матч. В команде его скрытый резерв
    называют «фембойной силой»: тонкая работа, подозрительно точные тайминги и привычка удерживать игру, которая
    уже должна была закончиться. Остальное ещё происходит.'
