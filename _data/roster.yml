  history_en: An old presence, still moving between the second position and the number that should not exist. Meepo
    and Invoker are less a hero pool than a test of patience. Somewhere in the team archive sits the title “Kazakhstan’s
    best dwarf” and the memory of a Khanty-Mansiysk hunt. Ask what happened there and the story changes.
  history_ru: Старая фигура состава, по-прежнему переходящая между второй позицией и цифрой, которой не должно существовать.
    Meepo и Invoker — скорее испытание терпения, чем просто пул героев. В архиве команды хранятся звание «лучший
    карлик Казахстана» и память о ханты-мансийском ханте. Спросите, что там произошло, — и история изменится.
