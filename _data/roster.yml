  history_en: 'Prokopchelik occupies position six—the role for which Cult Of Maids has its own designation, “Bubna.”
    The title sounds like the beginning of a long story, although the official job description still does little
    to explain what the position actually requires. Within the team, he is known through three phrases that have
    outlived the matches they came from: **the water carrier, the Huskar who did not survive, and the cross that
    never arrived**.


    Each part sounds like a brief incident report, but nobody keeps a single agreed version of events. Was it one
    match, several separate stories, or the result of too many retellings? The archive does not say. With every
    new recollection, the details become more confident while the evidence somehow fails to appear. It is less statistics
    than oral tradition now.


    In ordinary Dota 2, a sixth-position player might be expected to help the team with consumables, vision and
    whatever gaps the strategy leaves behind. Within Cult Of Maids, the role also includes preserving the historical
    uncertainty surrounding one’s own biography. Prokopchelik fulfils this duty without unnecessary comment.


    His profile deliberately leaves room for questions. Perhaps one day the complete story of Huskar and the missing
    cross will surface. For now, the team prefers not to rush the matter: some legends lose their power when explained
    all the way to the end.'
  history_ru: 'Prokopchelik занимает шестую позицию — ту самую, для которой в ростере Cult Of Maids существует отдельное
    обозначение «бубна». Эта роль сама по себе звучит как начало длинной истории, хотя официальное описание обязанностей
    пока не помогает понять, что именно входит в должностную инструкцию. В команде его знают по трём фразам, которые
    давно пережили исходные матчи: **водонос, Huskar, который не выжил, и крест, которого не было**.


    Каждая часть этой формулы звучит как краткий отчёт о происшествии, но единой версии событий никто не хранит.
    Был ли это один матч, несколько разных историй или результат коллективного пересказа — архив не уточняет. С
    каждым новым воспоминанием детали становятся увереннее, а доказательства почему-то не появляются. Это уже не
    столько статистика, сколько устный жанр.


    В обычной Dota 2 от игрока шестой позиции могут ждать помощи команде, расходников, обзора и готовности закрывать
    пробелы в стратегии. Внутри Cult Of Maids к этому добавляется обязанность поддерживать историческую неопределённость
    вокруг собственной биографии. Prokopchelik справляется с ней без лишних комментариев.


    Его профиль намеренно оставляет пространство для вопросов. Возможно, когда-нибудь появится полная версия истории
    про Huskar и тот самый крест. Но пока команда предпочитает не торопить события: некоторые легенды теряют силу,
    если объяснить их до конца.'
