  history_en: |-
    One of the first to answer the call, back when Cult Of Maids was a few people searching for a game. Positions 3 and 4, pressure, sudden decisions, builds that seem invented after the button was already pressed. Nyx Assassin, Abaddon, Enigma, Venomancer, Pit Lord. He says he showed the meta carry Abaddon first, then support Abaddon, and guards a 100% Venomancer win rate that no one dares to test.

    His **legendary feeder aura** is said to reach beyond the match: the internet fades for Pavuk and his neighbours at once. Then the strategy is simple: wait until reality reconnects. The verdict always comes after the match.
  history_ru: |-
    Один из первых, кто откликнулся, когда Cult Of Maids была несколькими людьми в поисках игры. Позиции 3 и 4, давление, внезапные решения и сборки, будто придуманные уже после нажатия кнопки. Nyx Assassin, Abaddon, Enigma, Venomancer, Pit Lord. Он говорит, что показал мете сначала керри-Abaddon, затем саппорт-Abaddon, и бережёт стопроцентный винрейт на Venomancer, который никто не решается проверить.

    Его **аура легендарного фидера**, по слухам, выходит за пределы матча: интернет гаснет у Павука и у соседей одновременно. Тогда стратегия проста: дождаться, пока реальность снова подключится. Вердикт всегда приходит после матча.
