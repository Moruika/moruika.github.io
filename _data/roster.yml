  history_en: The first player to join the roster and one of the long-standing pillars of Cult Of Maids. Pavuk favours aggressive,
    unpredictable play and builds that can surprise both opponents and teammates. His pool includes Nyx Assassin, Abaddon,
    Enigma, Venomancer and Pit Lord. Within the team, he is credited with popularising an unconventional carry Abaddon approach
    and a durable Venomancer build with a claimed 100% win rate. Expect pressure, experiments and very few standard answers.
  history_ru: Первый участник состава и один из тех, кто прошёл с Cult Of Maids большую часть пути. Pavuk предпочитает агрессивную,
    непредсказуемую игру и сборки, способные удивить как соперников, так и союзников. В его пуле — Nyx Assassin, Abaddon,
    Enigma, Venomancer и Pit Lord. Внутри команды за ним закрепилась история о том, как он ввёл в местную мету керри-Abaddon,
    а также Venomancer через выживаемость с заявленным стопроцентным винрейтом. Давление, эксперименты и минимум шаблонных
    решений.
