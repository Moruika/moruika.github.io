  history_en: |-
    He holds the sixth position, which the team calls "Bubna", and no one can say what the office truly requires. He is known by three phrases that outlived their matches: **the water carrier, the Huskar who did not survive, and the cross that never arrived**.

    No single version is kept. One match, several stories, or only too many tellings? The archive is silent, and each recollection grows surer while proof fails to appear. The role also demands guarding the uncertainty of one's own biography, which he does without comment. Some legends lose their power once explained.
  history_ru: |-
    Он держит шестую позицию, которую команда зовёт «бубной», и никто не скажет, чего эта должность на самом деле требует. Известен тремя фразами, пережившими свои матчи: **водонос, Huskar, который не выжил, и крест, которого не было**.

    Единой версии не хранится. Один матч, несколько историй или лишь слишком много пересказов? Архив молчит, а каждое воспоминание звучит увереннее, пока доказательства не появляются. В роль входит и охрана неопределённости собственной биографии, с чем он справляется без комментариев. Некоторые легенды теряют силу, если их объяснить.
