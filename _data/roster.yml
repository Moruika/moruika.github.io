  history_en: 'Mamut Rahal joined the group as it began to develop a clearer structure and more serious ambitions.
    His primary role is carry, and much of his reputation revolves around that position. The team calls him **God
    Sven**, and sometimes “the second Miracle-.” The titles are grand, but they reflect the squad’s confidence in
    his ability to handle the late game and turn accumulated advantages into results.


    For Mamut Rahal, farming is not simply waiting for the next item. It involves routes, timing and knowing when
    to take another wave of creeps and when to join the team. His movements through the jungle are occasionally
    discussed as if they were a separate strategic discipline. According to team lore, Tier 1 carries study his
    routes to learn how to earn more gold. There is no official confirmation, but it sounds convincing enough for
    team chat.


    Playing position one requires patience: not every fight should be taken, not every risk is worth it, and sometimes
    the best contribution is to keep farming calmly while teammates create space. Mamut Rahal works around that
    balance, choosing when to turn accumulated resources into pressure across the map.


    His image combines a confident carry with a character whose reputation keeps growing through exaggeration. Today
    he is God Sven; tomorrow someone may claim he invented a new way to farm the ancient camps. In Cult Of Maids,
    titles do not always require evidence—sometimes it is enough that the team keeps winning games.'
  history_ru: 'Mamut Rahal присоединился к коллективу ближе к тому моменту, когда компания начала превращаться в
    команду с более понятной структурой и амбициями. Его основная роль — керри, и именно вокруг этой позиции строится
    большая часть его репутации. В команде его называют **Богом Sven**, а иногда — «вторым Miracle-»: формулировки
    громкие, но в них отражается уверенность в его способности взять на себя позднюю стадию игры и превратить накопленное
    преимущество в результат.


    Фарм для Mamut Rahal — не просто ожидание нужного предмета. Это маршрут, расчёт времени и понимание того, когда
    можно забрать ещё одну волну, а когда пора подключаться к команде. Его перемещения по лесу иногда обсуждают
    так, словно это отдельная стратегическая дисциплина. По легенде, керри первого уровня изучают его маршруты,
    чтобы понять, как получать больше золота; официальных подтверждений этому нет, но звучит достаточно убедительно
    для командного чата.


    Игра на первой позиции требует терпения: не каждую драку нужно принимать, не каждый риск оправдан, а иногда
    лучший вклад в команду — спокойно продолжать фармить, пока остальные создают пространство. Mamut Rahal старается
    понимать эту грань и выбирать момент, когда накопленные ресурсы пора превратить в давление на карте.


    Его образ — сочетание уверенного керри и персонажа, вокруг которого постепенно растут преувеличения. Сегодня
    это God Sven, завтра кто-нибудь объявит, что он изобрёл новый способ фармить древних. В Cult Of Maids подобные
    титулы не всегда требуют доказательств — иногда достаточно, чтобы команда продолжала выигрывать матчи.'
