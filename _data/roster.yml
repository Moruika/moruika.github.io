  history_en: One of the team’s long-standing players, alongside Pavuk. Slanets is known for a strong Meepo and Invoker, heroes
    that reward control, practice and a clear understanding of the game. His personal lore includes the title “Kazakhstan’s
    best dwarf” and a win at the Khanty-Mansiysk International hunt. A veteran presence from the earlier days of Cult Of Maids,
    with a style and reputation of his own.
  history_ru: Один из старейших игроков команды наравне с Pavuk. Сланец известен сильной игрой на Meepo и Invoker — героях,
    требующих контроля, практики и понимания происходящего на карте. Внутри команды за ним закрепились звание «лучший карлик
    Казахстана» и победа в ханте мансийского интернешнла. Представитель старой гвардии Cult Of Maids со своим стилем и репутацией.
