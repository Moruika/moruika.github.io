  history_en: 'Callsign 200 is a reserve player whose biography begins and almost immediately arrives at one recorded
    answer: **beer**. It is not a complete description of his playstyle or a detailed career report, but the Cult
    Of Maids archive considers it enough to raise more questions than a lengthy résumé would.


    Team history is not always preserved in scoreboards. Sometimes it survives as short remarks, spontaneous associations
    and words whose meaning was obvious to everyone present on a particular evening. Later, the context disappears,
    the witnesses remember different versions, and the phrase keeps living on its own. “Beer” became exactly that
    kind of entry: simple, recognisable and remarkably resistant to clarification.


    Pozivnoi 200 is listed at position three, although his biography does not yet reveal how he prefers to play
    or which matches he considers important. Perhaps the omission is temporary; perhaps it is the only way to keep
    the team archive in balance. Either way, STRATZ stores the statistics while the team stores the context that
    statistics cannot capture.


    The profile is deliberately brief in what it reveals, but not in what it means. If new details emerge, the entry
    can be expanded. Until then, its contents remain surprisingly precise: callsign 200, reserve, position three,
    and an answer that has become part of the folklore.'
  history_ru: 'Позывной 200 — игрок запаса, чья биография начинается и почти сразу упирается в единственную запись:
    **пиво**. Это не полноценная характеристика игрового стиля и не подробный отчёт о карьере, но, по мнению архива
    Cult Of Maids, информации достаточно, чтобы вызвать больше вопросов, чем длинное резюме.


    В командной истории иногда остаются не таблицы результатов, а короткие реплики, случайные ассоциации и слова,
    смысл которых был очевиден всем присутствовавшим в конкретный вечер. Позже контекст исчезает, участники помнят
    разные версии, а фраза продолжает жить сама по себе. «Пиво» стало именно такой записью — простой, узнаваемой
    и удивительно устойчивой к попыткам что-либо уточнить.


    Позывной 200 числится на третьей позиции, хотя сама биография пока не стремится раскрыть, как именно он предпочитает
    играть и какие матчи считает главными. Возможно, это временная недосказанность; возможно, единственный способ
    сохранить равновесие в командном архиве. В любом случае, STRATZ хранит статистику, а команда — контекст, которого
    в статистике нет.


    Профиль оставлен намеренно коротким по смыслу, но не по значению. Если однажды появятся новые подробности, запись
    можно будет дополнить. До тех пор её содержание остаётся удивительно точным: позывной 200, запас, позиция 3
    и ответ, который уже стал частью фольклора.'
