    One of the newest, so his chronicle is still unwritten. Positions 4 and 5: notice danger first, choose the target for control, and pull a teammate back at the very moment they have mentally written their farewell. The team calls his hidden resource **"femboy power"**: the explanation for a clutch save, a hero who survives one more fight, a game already declared lost that refuses to end. On paper it is positioning and timing. In team chat the answer is shorter.

    Some already compare his first games to supports of far higher tiers. A biography need not be finished on the day it is written; the strangest chapters arrive later.
  history_ru: |-
    Один из самых новых, поэтому его летопись ещё не дописана. Позиции 4 и 5: заметить опасность первым, выбрать цель для контроля и вытянуть союзника в тот миг, когда он уже мысленно простился. Скрытый ресурс команда зовёт **«фембойной силой»**: так объясняют сейв в критический момент, героя, переживающего ещё одну драку, и игру, которую уже списали, а она не заканчивается. На бумаге это позиционирование и тайминги. В командном чате ответ короче.

    Кое-кто уже сравнивает его первые игры с саппортами куда более высокого уровня. Биографии не обязательно быть законченной в день записи; самые странные главы приходят позже.
