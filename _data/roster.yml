  history_en: 'A recent addition who quickly showed promising results. Rapunzel stands out for strong micro and a good understanding
    of how different roles fit into a match. That awareness helps turn support play into more than spell-casting: positioning,
    timing and knowing what the team needs next all matter.'
  history_ru: 'Недавно присоединился к команде и быстро показал хорошие результаты. Рапунцель выделяется сильным микро и хорошим
    пониманием того, как разные роли складываются в общую игру. Благодаря этому поддержка не сводится к нажатию способностей:
    важны позиционирование, тайминги и понимание того, что команде потребуется дальше.'
