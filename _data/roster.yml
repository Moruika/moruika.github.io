  history_en: |-
    Captain of Cult Of Maids, keeper of the roster and of a promise the team has never worded the same way twice: The International. Between matches he builds a game of his own and keeps the stream lit, as if the roster alone were too light a burden.

    Dawnbreaker, Windranger, Techies, Grimstroke, Vengeful Spirit. Victories over TI players and streamers, though every retelling grows another detail. His true title is **Turbo Emperor**: the match count outran arithmetic long ago, and one day his statistics may need a server of their own, with a backup hidden somewhere safe. Any plan can wait for one more quick match. This is only the beginning.
  history_ru: |-
    Капитан Cult Of Maids, хранитель ростера и обещания, которое команда ни разу не сформулировала дважды одинаково: The International. Между матчами он строит собственную игру и не даёт погаснуть стриму — будто одного ростера для него слишком мало.

    Dawnbreaker, Windranger, Techies, Grimstroke, Vengeful Spirit. Победы над игроками TI и стримерами, хотя с каждым пересказом вырастает новая деталь. Его истинный титул — **Император турбо**: счёт матчей давно обогнал арифметику, и однажды его статистике понадобится собственный сервер с резервной копией, спрятанной в надёжном месте. Любой план подождёт ещё один быстрый матч. Всё только начинается.
