  history_en: 'Kodeinovi Tsar joined Cult Of Maids relatively recently but has already carved out a place in the
    team’s ecosystem. He can play positions 1, 2 and 4, so his role depends on what the roster needs and how ambitious
    the plan for a particular match has become. An official explanation for his arrival exists, although every retelling
    somehow makes it sound a little more suspicious.


    His hero pool includes Void Spirit, Zeus, Rubick and Lion. Rubick is especially suited to his apparent talent
    for claiming kills that were almost credited to someone else: a teammate does the hard work, Tsar adds the final
    touch, and the scoreboard remembers his name. Lion, meanwhile, can deliver not only control but also that particular
    sense of discomfort that makes some players launch Dota in the first place.


    Then there is the Pudge story. His hooks do not always find their targets, but there are several possible interpretations:
    an accuracy problem, a long-term experiment, or an attempt to make the enemy feel safe. The team has wisely
    chosen not to interfere with the scientific process.


    Behind the jokes is a flexible player with room to grow. His potential is still being explored, and his best
    games may well be ahead of him. For now, Kodeinovi Tsar keeps gaining experience, testing heroes and reminding
    the team that even a missed hook can become part of the legend.'
  history_ru: 'Kodeinovi Tsar присоединился к Cult Of Maids сравнительно недавно, но уже успел занять собственное
    место в командной экосистеме. Он может играть на позициях 1, 2 и 4, поэтому его роль зависит от того, что требуется
    составу и насколько смелым оказался план на конкретную игру. Официальное объяснение его появления в команде
    существует, но в пересказах оно каждый раз звучит чуть подозрительнее.


    Среди его героев — Void Spirit, Zeus, Rubick и Lion. На Rubick особенно заметна любовь к убийствам, которые
    уже почти записали на счёт другого игрока: союзник проделал всю работу, Tsar аккуратно поставил точку — и статистика
    запомнила именно его. Lion, в свою очередь, способен принести сопернику не только контроль, но и то самое ощущение
    дискомфорта, ради которого некоторые игроки вообще запускают Dota.


    У него есть и отдельная история с Pudge. Его хуки пока не всегда находят цель, однако это можно трактовать по-разному:
    как проблему с точностью, как долгосрочный эксперимент или как попытку заставить противника расслабиться. Команда
    предпочитает не вмешиваться в научную часть проекта.


    За шутками остаётся игрок с несколькими возможными ролями и пространством для развития. Потенциал ещё предстоит
    раскрыть, а лучшие игры вполне могут быть впереди. Пока же Kodeinovi Tsar продолжает собирать опыт, проверять
    героев и напоминать команде, что даже промах иногда становится частью легенды.'
