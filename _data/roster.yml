  history_en: 'A very new member of Cult Of Maids with limited experience but plenty of room to grow. Cheburaska is developing
    as a support and has already shown a knack for turning difficult situations around. His secret weapon is femboy power:
    delicate support play, timely saves and the confidence to challenge even the early-career performances of some Tier 1
    supports. The experience is still growing; the potential is already part of the conversation.'
  history_ru: 'Совсем новый участник Cult Of Maids: опыта пока немного, зато потенциала на будущее хватает. Чебурашка развивается
    на позициях поддержки и уже показывает способность спасать сложные игры. Его секретное оружие — фембойная сила: ювелирная
    игра на саппортах, своевременные сейвы и уверенность, с которой он готов конкурировать даже с некоторыми тир-1 саппортами
    в начале их карьеры. Опыт ещё набирается, но потенциал уже заметен.'
