  history_en: One of the founders of Cult Of Maids and the team’s coach. Heryn focuses on identifying each player’s strengths,
    finding areas to improve and helping the roster work as a unit. His coaching sessions played an important part in the
    team’s Turbo tournament win. The staff role is less visible during a match, but its impact is felt in preparation and
    decision-making.
  history_ru: Один из основателей Cult Of Maids и тренер команды. Heryn умеет замечать сильные стороны каждого игрока, находить
    точки роста и помогать составу работать как единое целое. Его коуч-сессии сыграли важную роль в победе команды на турнире
    по Turbo. Работа штаба не всегда заметна во время матча, но её результат проявляется в подготовке и принятии решений.
