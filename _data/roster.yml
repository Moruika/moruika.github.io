  history_en: 'Heryn is the founder of Cult Of Maids and a coach whose work begins where a simple review of statistics
    ends. He looks not only at what a player did in a match, but why they chose that decision, what they were worried
    about and when they stopped trusting their own play. That approach helps identify strengths, break down recurring
    mistakes and assign roles based not only on numbers but also on the person behind the keyboard.


    One visible result of his work is the team’s Turbo tournament victory. A coach rarely occupies the centre of
    a highlight: the screen shows heroes, items and the final score, while much of the preparation happens earlier,
    between matches and in conversations the audience never hears. But when a team starts playing with better coordination,
    someone has helped it see the bigger picture.


    Within Cult Of Maids, Heryn is known for reading players and finding an approach to different personalities.
    Sometimes it is enough to point out a mistake at the right moment; sometimes the plan needs to change; sometimes
    a player simply needs to be convinced they can do more than they believe. It is not magic, although the difference
    is not always obvious from the outside.


    His job is not to play instead of the team, but to help it become stronger and more consistent. The roster still
    has plenty of problems to solve, which is why a coach’s work does not end with a single victory. If Cult Of
    Maids has a next objective, Heryn is already considering the steps needed to reach it—and the places where the
    team might stumble along the way.'
  history_ru: 'Heryn — основатель Cult Of Maids и тренер, чья работа начинается там, где заканчивается простое обсуждение
    статистики. Он смотрит не только на то, что игрок сделал в матче, но и на то, почему тот выбрал именно это решение,
    чего опасался и в какой момент перестал доверять собственной игре. Такой подход помогает находить сильные стороны,
    разбирать привычные ошибки и подбирать роли не только по цифрам, но и по характеру человека.


    Одно из заметных подтверждений его работы — победа команды на Turbo-турнире. Тренер редко оказывается в центре
    хайлайта: на экране остаются герои, предметы и итоговый счёт, а большая часть подготовки происходит заранее,
    между матчами и в разговорах, которые зрители не слышат. Но если команда начинает действовать слаженнее, значит,
    кто-то помог ей увидеть общую картину.


    Внутри Cult Of Maids Heryn известен умением читать игроков и находить подход к разным характерам. Иногда достаточно
    вовремя подсветить ошибку, иногда нужно изменить привычный план, а иногда — убедить человека, что он способен
    на большее, чем сам думает. Это не магия, хотя со стороны разница не всегда очевидна.


    Его задача — не играть вместо команды, а помогать ей становиться сильнее и устойчивее. У коллектива ещё много
    нерешённых вопросов, и именно поэтому работа тренера не заканчивается одной победой. Если у Cult Of Maids есть
    следующая цель, Heryn уже думает о том, какие шаги приведут к ней и где команда может споткнуться по дороге.'
