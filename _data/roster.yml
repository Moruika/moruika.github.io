  history_en: |-
    Arrived recently, and the team can no longer say it was ever without him. Positions 1, 2 and 4, whichever the night demands. An official explanation for his arrival exists; each retelling makes it sound stranger. Void Spirit, Zeus, Rubick, Lion. On Rubick he takes kills that were almost someone else's: a teammate does the work, Tsar adds the final touch, and the scoreboard remembers him.

    His Pudge hooks do not always find their mark. Perhaps poor aim, perhaps a long experiment, perhaps a way to make the enemy feel safe. The team wisely leaves the research alone.
  history_ru: |-
    Появился недавно, но команда уже не может сказать, что когда-то обходилась без него. Позиции 1, 2 и 4, какую потребует ночь. Официальное объяснение его появления существует; в каждом пересказе оно звучит страннее. Void Spirit, Zeus, Rubick, Lion. На Rubick он забирает убийства, которые почти достались другому: союзник делает работу, царь ставит последний штрих, и табло запоминает его.

    Хуки на Pudge не всегда находят цель. Возможно, неточность, возможно, долгий эксперимент, возможно, способ усыпить бдительность врага. Команда мудро не мешает исследованию.
