name: IndexNow

on:
  push:
    branches:
      - main
  schedule:
    # Re-ping search engines weekly even without new commits, so pages
    # that haven't been crawled yet get resubmitted.
    - cron: "0 6 * * 1"
  workflow_dispatch: {}

jobs:
  indexnow:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Send IndexNow notification
        run: python3 scripts/indexnow.py
