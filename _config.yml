title: "Morui / Moruika — Gaming, Development & Creative Projects"
description: "Official website of Kirill Vinogradov, known as Morui / Moruika — artist, game developer, musician, competitive Dota 2 player, streamer, and content creator."

author:
  name: "Kirill Vinogradov"
  alternate_name: ["Morui", "Moruika"]
  url: "https://moruika.github.io/"
  sameAs:
    - "https://github.com/Moruika"
    - "https://www.youtube.com/@fuckedmorui"
    - "https://www.twitch.tv/moruika"
    - "https://www.tiktok.com/@maidmorui"
    - "https://soundcloud.com/moruika"
    - "https://t.me/moruika"
    - "https://vk.com/morui"
    - "https://steamcommunity.com/id/moruika"
    - "https://stratz.com/players/860495275"
    - "https://www.opendota.com/players/860495275"
    - "https://www.dotabuff.com/players/860495275"
baseurl: ""
url: "https://moruika.github.io"
timezone: Europe/Moscow

# --- Live widgets -------------------------------------------------------
dota_account_id: 860495275          # OpenDota/STRATZ player id (public match data must be exposed in Dota 2 settings)
soundcloud_url: "https://soundcloud.com/moruika"
team_founded_year: 2021
# Guestbook (giscus). Stays hidden until BOTH ids are filled in: https://giscus.app
giscus:
  repo: "Moruika/moruika.github.io"
  repo_id: ""
  category: "Guestbook"
  category_id: ""
  term: "cult-guestbook"            # one shared thread for the EN and RU /cult/ pages

current_status_en: "Creating a game."
current_status_ru: "Делаю игру."

markdown: kramdown
strict_front_matter: true  # fail the build on broken front matter instead of silently producing a bad page
permalink: /blog/:year/:month/:day/:title/

defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
  - scope:
      path: ""
    values:
      layout: "default"

collections:
  posts:
    output: true

exclude:
  - README.md
  - scripts
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  - .github
